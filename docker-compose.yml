# ── Secrets (prod profile only — file-based, never in env vars) ───────────────
secrets:
  db_password:
    file: ./secrets/db_password.txt
  session_secret:
    file: ./secrets/session_secret.txt
  key_encryption_secret:
    file: ./secrets/key_encryption_secret.txt
  mcp_auth_token:
    file: ./secrets/mcp_auth_token.txt
  gemini_api_key:
    file: ./secrets/gemini_api_key.txt
  google_generative_ai_api_key:
    file: ./secrets/google_generative_ai_api_key.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  anthropic_api_key:
    file: ./secrets/anthropic_api_key.txt
  groq_api_key:
    file: ./secrets/groq_api_key.txt

# ── Networks (prod profile only) ──────────────────────────────────────────────
networks:
  frontend:
  backend:
    internal: true

services:

  # ── 1. Database ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: map
      POSTGRES_USER: map
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set (openssl rand -hex 24)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U map -d map"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # dev: expose port for TablePlus / DBeaver (loopback only — never bind 0.0.0.0)
    profiles: []
    ports:
      - "127.0.0.1:5432:5432"

  # ── 2. Cache / pub-sub ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # loopback only — never expose Redis to the LAN
    ports:
      - "127.0.0.1:6379:6379"

  # ── 3. Next.js app ───────────────────────────────────────────────────────────
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://map:${DB_PASSWORD:?DB_PASSWORD must be set (openssl rand -hex 24)}@postgres:5432/map
      REDIS_URL: redis://redis:6379
      # Both must be set explicitly — no in-tree default to prevent accidental
      # prod deploys with a known-public secret. Generate with: openssl rand -hex 32
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set (openssl rand -hex 32)}
      KEY_ENCRYPTION_SECRET: ${KEY_ENCRYPTION_SECRET:?KEY_ENCRYPTION_SECRET must be set (openssl rand -hex 32)}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-0.1.0}
      DEPLOYMENT_WORKER_URL: http://deployment-worker:3200
      MCP_INTERNAL_URL: http://mcp-server:3100/mcp
      OPENSHELL_RUNTIME_ENABLED: ${OPENSHELL_RUNTIME_ENABLED:-true}
      OPENSHELL_RUNTIME_V2_ENABLED: ${OPENSHELL_RUNTIME_V2_ENABLED:-true}
      OPENSHELL_ALLOW_LEGACY_SECRET_ENV: ${OPENSHELL_ALLOW_LEGACY_SECRET_ENV:-false}
      NODE_ENV: ${NODE_ENV:-development}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      deployment-worker:
        condition: service_healthy
    restart: unless-stopped

  # ── 4. MCP server ────────────────────────────────────────────────────────────
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
    environment:
      DATABASE_URL: postgres://map:${DB_PASSWORD:?DB_PASSWORD must be set (openssl rand -hex 24)}@postgres:5432/map
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN must be set (openssl rand -hex 32)}
      MCP_PORT: 3100
      APP_VERSION: ${APP_VERSION:-0.1.0}
      MCP_CORS_ORIGIN: ${APP_URL:-http://localhost:3000}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      DEPLOYMENT_WORKER_URL: http://deployment-worker:3200
      OPENSHELL_RUNTIME_ENABLED: ${OPENSHELL_RUNTIME_ENABLED:-true}
      OPENSHELL_RUNTIME_V2_ENABLED: ${OPENSHELL_RUNTIME_V2_ENABLED:-true}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      postgres:
        condition: service_healthy
      deployment-worker:
        condition: service_healthy
    restart: unless-stopped

  # ── 5. OpenShell gateway ─────────────────────────────────────────────────────
  openshell-bootstrap:
    image: ghcr.io/nvidia/openshell/gateway:latest
    user: "0:0"
    entrypoint: ["/usr/local/bin/openshell-gateway"]
    command: ["generate-certs", "--output-dir", "/var/openshell/tls"]
    volumes:
      - openshell_state:/var/openshell
    restart: "no"

  openshell-gateway:
    image: ghcr.io/nvidia/openshell/gateway:latest
    user: "0:0"
    environment:
      OPENSHELL_GATEWAY_CONFIG: /etc/openshell/gateway.toml
      OPENSHELL_DRIVERS: docker
      OPENSHELL_DB_URL: sqlite:/var/openshell/openshell.db
      OPENSHELL_DISABLE_TLS: "true"
      XDG_DATA_HOME: ${PWD}/.openshell-cache/data
      XDG_STATE_HOME: ${PWD}/.openshell-cache/state
    volumes:
      - openshell_state:/var/openshell
      - ${PWD}/.openshell-cache:${PWD}/.openshell-cache
      - ./openshell-gateway/gateway.toml:/etc/openshell/gateway.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      openshell-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── 6. Deployment worker ─────────────────────────────────────────────────────
  deployment-worker:
    build:
      context: .
      dockerfile: deployment-worker/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
    environment:
      DATABASE_URL: postgres://map:${DB_PASSWORD:?DB_PASSWORD must be set (openssl rand -hex 24)}@postgres:5432/map
      APP_VERSION: ${APP_VERSION:-0.1.0}
      OPENSHELL_GATEWAY_URL: ${OPENSHELL_GATEWAY_URL:-http://openshell-gateway:8080}
      DEPLOYMENT_WORKER_PORT: 3200
      DEPLOYMENT_WORKSPACE: ${DEPLOYMENT_WORKSPACE:-/var/lib/map-deployments}
      MCP_INTERNAL_URL: ${MCP_INTERNAL_URL:-http://mcp-server:3100/mcp}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN must be set (openssl rand -hex 32)}
      OPENSHELL_RUNTIME_ENABLED: ${OPENSHELL_RUNTIME_ENABLED:-true}
      OPENSHELL_RUNTIME_V2_ENABLED: ${OPENSHELL_RUNTIME_V2_ENABLED:-true}
      OPENSHELL_ALLOW_LEGACY_SECRET_ENV: ${OPENSHELL_ALLOW_LEGACY_SECRET_ENV:-false}
      OPENSHELL_ALLOW_RAW_CLI: ${OPENSHELL_ALLOW_RAW_CLI:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      GOOGLE_SERVICE_ACCOUNT_KEY: ${GOOGLE_SERVICE_ACCOUNT_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_AI_API_KEY: ${AZURE_AI_API_KEY:-}
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - deployment_workspace:/var/lib/map-deployments
    ports:
      - "127.0.0.1:3200:3200"
    depends_on:
      postgres:
        condition: service_healthy
      openshell-gateway:
        condition: service_started
    restart: unless-stopped

  # ── 7. Nginx (prod only — profile: nginx) ────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    profiles: ["nginx"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Uncomment for HTTPS:
      # - ./nginx/nginx.https.conf:/etc/nginx/conf.d/https.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - nextjs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  openshell_state:
  deployment_workspace:
