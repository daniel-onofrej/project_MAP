worker_processes auto;

events {
    # Raised from 1024 — each Nginx worker can handle more simultaneous connections
    worker_connections 65535;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Tuned keepalive: 75 s matches most browser defaults; reduces TCP churn
    keepalive_timeout 75;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    # 30 API requests/minute per IP; burst of 10 queued before 429 is returned
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream nextjs {
        server nextjs:3000;
        keepalive 64;
    }

    upstream mcp {
        server mcp-server:3100;
        keepalive 8;
    }

    # ── Shared proxy header snippet ───────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── HTTP server ───────────────────────────────────────────────────────────
    # In production (with TLS certs), this redirects to HTTPS via nginx.https.conf.
    # In local dev (no certs), this serves the app directly over HTTP.
    server {
        listen 80;
        server_name _;

        # Allow the ACME challenge for cert-manager / certbot renewals
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ── Security response headers ─────────────────────────────────────────
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header X-Frame-Options        "SAMEORIGIN"                      always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # ── Common proxy headers ──────────────────────────────────────────────
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;

        # ── Health endpoint (used by Nginx HEALTHCHECK & K8s probes) ─────────
        location = /api/health {
            proxy_pass         http://nextjs;
            proxy_http_version 1.1;
            access_log         off;
        }

        # ── SSE streaming endpoint ────────────────────────────────────────────
        # Rate-limited; buffering disabled so events reach the browser immediately
        location ~ ^/api/agents/[^/]+/stream$ {
            limit_req          zone=api_limit burst=5 nodelay;
            proxy_pass         http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header   Connection '';
            proxy_buffering    off;
            proxy_cache        off;
            add_header         X-Accel-Buffering no always;
            proxy_read_timeout 3600s;
        }

        # ── Generic API endpoints (rate-limited) ──────────────────────────────
        location /api/ {
            limit_req  zone=api_limit burst=10 nodelay;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
        }

        # ── MCP server (bearer-token protected at the app layer) ──────────────
        location /mcp {
            limit_req          zone=api_limit burst=5 nodelay;
            proxy_pass         http://mcp;
            proxy_http_version 1.1;
        }

        # ── Everything else → Next.js ─────────────────────────────────────────
        location / {
            proxy_pass         http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
        }
    }

    # ── HTTPS server block — included only in production (see nginx.https.conf) ──
    include /etc/nginx/conf.d/*.conf;
}
