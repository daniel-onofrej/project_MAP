# ── Production HTTPS server block ────────────────────────────────────────────
# Mounted into /etc/nginx/conf.d/ only when TLS certs exist (docker-compose.prod.yml).
# In local dev (docker-compose.yml only), this file is NOT mounted, so nginx
# serves HTTP directly on port 80 without any redirect.

server {
    listen 80;
    server_name _;

    # Redirect all HTTP to HTTPS in production
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2  on;
    server_name _;

    # ── TLS configuration ─────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Security response headers ─────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                     always;
    add_header X-Frame-Options           "SAMEORIGIN"                                  always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"             always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"    always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss: https:;" always;

    # ── Common proxy headers ──────────────────────────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie            $http_cookie;

    # ── Health endpoint ───────────────────────────────────────────────────────
    location = /api/health {
        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        access_log         off;
    }

    # ── SSE streaming endpoint ────────────────────────────────────────────────
    location ~ ^/api/agents/[^/]+/stream$ {
        limit_req          zone=api_limit burst=5 nodelay;
        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        add_header         X-Accel-Buffering no always;
        proxy_read_timeout 3600s;
    }

    # ── Generic API endpoints (rate-limited) ──────────────────────────────────
    location /api/ {
        limit_req  zone=api_limit burst=10 nodelay;
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
    }

    # ── MCP server (bearer-token protected at the app layer) ──────────────────
    location /mcp {
        limit_req          zone=api_limit burst=5 nodelay;
        proxy_pass         http://mcp;
        proxy_http_version 1.1;
    }

    # ── Everything else → Next.js ─────────────────────────────────────────────
    location / {
        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }
}
